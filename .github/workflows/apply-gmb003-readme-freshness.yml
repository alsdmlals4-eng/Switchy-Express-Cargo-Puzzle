name: Apply GMB-003 README Freshness

on:
  push:
    branches:
      - agent/gmb-003-route-end-switch-direction-plan
    paths:
      - .github/workflows/apply-gmb003-readme-freshness.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: agent/gmb-003-route-end-switch-direction-plan
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Apply exact replacements
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}: {old!r}')
              target.write_text(text.replace(old, new), encoding='utf-8')

          active = '기획서/00_프로젝트_허브/ACTIVE_CONTEXT.md'
          replace_once(active, 'PR #83/#99/#100 MERGE: PASS', 'PR #83 MERGE: PASS · PR #99/#100 MERGE: PASS')

          readme = 'README.md'
          replace_once(readme, '- 운행 중 persistent branch·crossing 직접 전환과 점유 잠금', '- 운행 중 persistent branch·crossing 직접 전환과 점유 잠금\n- SWITCH의 세 reciprocal 방향 화살표·직접 선택·진입 방향 U턴 계획')
          replace_once(readme, '- 제한 시간 미배송 실패, 마지막 하역 즉시 성공', '- 제한 시간 미배송 실패, 마지막 하역 즉시 성공\n- 배송·하역 판정 뒤 이동 불가 시 `FAILURE · ROUTE_END` 계획')
          replace_once(readme, '- 한쪽 reciprocal 연결만 있는 최종 종착역 허용', '- 색상과 무관하게 한쪽 reciprocal 연결만 있는 최종 종착역 허용')
          replace_once(readme, '현재 제품 권위: `GMB-002 · SX-DEC-027~039`  \n최신 병합 후 정본 감사: `SX-AUD-025`', '현재 제품 권위: `GMB-003 · SX-DEC-027~042`  \n현재 기획 감사: `SX-AUD-026 · APPROVED_PENDING_MERGE`')
          replace_once(
              readme,
              '''F5
          → Title 종료 표시
          → Briefing
          → BUILD HUD·도구 표시
          → 권장 배치
          → 한쪽 연결 종착역에서 마지막 화물 하역·SUCCESS
          → BUILD 또는 RUN 메뉴 열기
          → 취소 후 동일 플레이 상태 유지
          → 다시 메뉴 열기
          → 종료 확정 후 Title 복귀''',
              '''F5
          → Title 종료 표시
          → Briefing
          → BUILD HUD·도구 표시
          → 파란 한쪽 연결 종착역 판정
          → 배송 전 노선 끝 FAILURE/ROUTE_END
          → SWITCH 세 방향 화살표·진입 방향 U턴·점유 잠금
          → 마지막 화물 하역·SUCCESS 우선순위
          → BUILD 또는 RUN 메뉴 열기
          → 취소 후 동일 플레이 상태 유지
          → 다시 메뉴 열기
          → 종료 확정 후 Title 복귀''',
          )
          replace_once(
              readme,
              '현재 사용자 수동 증거는 `TITLE_EXIT_VISIBLE_PASS`까지만 확정됐다. 한쪽 연결 종착역 완주와 BUILD·RUN 중간 종료의 취소·확정은 `RETEST_REQUIRED`다.',
              '현재 사용자 수동 증거는 `TITLE_EXIT_VISIBLE_PASS`, `SUCCESS_RESULT_VISIBLE_PASS`, 빨간 한쪽 연결 역 PASS와 파란 한쪽 연결 역 FAIL이다. 파란 역 원인은 자동 parity 테스트 전까지 미확정이며, 새 ROUTE_END·분기 화살표·U턴과 BUILD/RUN 중간 종료는 `IMPLEMENTATION_PENDING` 또는 `RETEST_REQUIRED`다.',
          )
          replace_once(readme, 'repository_main_observed: 212d37e4577a6ffdb7b93e92de6a82785c2976eb', 'repository_main_observed: efe0ab7330387d1b411962074b5f91b3043fddc8')
          replace_once(
              readme,
              '''pr_83: MERGED
          finite_automated_core: PASS''',
              '''pr_83: MERGED
          pr_94: CLOSED_ARCHIVED_NOT_MERGED
          pr_99: MERGED
          pr_100: MERGED
          finite_automated_core: PASS''',
          )
          replace_once(
              readme,
              '''one_sided_station_terminal: PASS_AUTOMATED
          mid_run_exit: PASS_AUTOMATED
          title_exit_visible: PASS_USER_LOCAL
          pc_local_route_and_mid_run_retest: RETEST_REQUIRED''',
              '''one_sided_station_terminal_red: PASS_AUTOMATED_AND_USER_LOCAL
          one_sided_station_terminal_blue: FAIL_USER_LOCAL_ROOT_CAUSE_UNVERIFIED
          success_result_visible: PASS_USER_LOCAL
          route_end_game_over: APPROVED_IMPLEMENTATION_PENDING
          switch_three_direction_arrows_uturn: APPROVED_IMPLEMENTATION_PENDING
          mid_run_exit: PASS_AUTOMATED
          title_exit_visible: PASS_USER_LOCAL
          pc_local_route_and_mid_run_retest: RETEST_REQUIRED''',
          )
          replace_once(readme, '7. `기획서/50_제작_검증/SX_AUD_025_POST_MERGE_CANON_FRESHNESS_AND_GATE_RECOVERY.md`', '7. `기획서/50_제작_검증/SX_AUD_026_ROUTE_END_AND_SWITCH_DIRECTION_PLAN.md`')
          PY
          rm .github/workflows/apply-gmb003-readme-freshness.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "docs: sync GMB-003 README freshness"
          git push origin HEAD:agent/gmb-003-route-end-switch-direction-plan
