          - 제한 시간 실패는 `TIME_EXPIRED`로 구분한다.
          - 동일 배치 재시도와 편집 복구를 유지한다.

          ## SX-DEC-042 Switch Direction Arrow Direction

          - SWITCH의 reciprocal 세 연결 방향을 모두 절차적 화살표로 표시한다.
          - 선택 방향은 굵기·채움으로 강조하고 나머지 방향도 계속 보인다.
