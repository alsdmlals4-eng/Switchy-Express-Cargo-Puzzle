name: Windows Demo Export

on:
  pull_request:
    branches: [main]
    paths:
      - game/demo/**
      - game/finite/**
      - data/maps/**
      - art/product_assets/ed_hybrid_v1/**
      - art/product_assets/ed_hybrid_v2/**
      - project.godot
      - export_presets.cfg
      - tools/validation/verify_exported_runtime_json.gd
      - tests/demo/**
      - tests/finite/**
      - tests/python/**
      - .github/workflows/windows-demo-export.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-windows-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install Python contracts and human-blueprint dependencies
        run: python -m pip install --disable-pip-version-check pytest==8.3.5 pypdf==6.14.2 reportlab==4.4.9

      - name: Download Godot 4.7.1
        run: |
          curl --fail --location --retry 3 \
            --output godot.zip \
            https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q godot.zip
          chmod +x Godot_v4.7.1-stable_linux.x86_64
          ./Godot_v4.7.1-stable_linux.x86_64 --version

      - name: Run Python contracts
        env:
          GODOT_BINARY: ${{ github.workspace }}/Godot_v4.7.1-stable_linux.x86_64
        run: python -m pytest tests/python -q

      - name: Install Godot 4.7.1 export templates
        run: |
          curl --fail --location --retry 3 \
            --output templates.tpz \
            https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_export_templates.tpz
          rm -rf templates-extracted
          mkdir -p templates-extracted
          unzip -q templates.tpz -d templates-extracted
          mkdir -p "$HOME/.local/share/godot/export_templates/4.7.1.stable"
          cp -R templates-extracted/templates/. \
            "$HOME/.local/share/godot/export_templates/4.7.1.stable/"

      - name: Run headless tests
        shell: bash
        run: |
          timeout 180s ./Godot_v4.7.1-stable_linux.x86_64 \
            --headless \
            --import \
            --path .

          set +e
          output=$(timeout 45s ./Godot_v4.7.1-stable_linux.x86_64 \
            --headless \
            --path . \
            --script res://tests/run_tests.gd 2>&1)
          status=$?
          set -e

          printf '%s\n' "$output"

          if printf '%s\n' "$output" | grep -E 'SCRIPT ERROR:|(^|[[:space:]])ERROR:'; then
            echo 'Godot emitted a runtime or script error.' >&2
            exit 1
          fi

          exit "$status"

      - name: Export Windows debug demo
        run: |
          mkdir -p builds/windows
          ./Godot_v4.7.1-stable_linux.x86_64 \
            --headless \
            --path . \
            --export-debug "Windows Demo" \
            builds/windows/SwitchyExpressVerticalSlice.exe

      - name: Prove Windows preset runtime JSON payload
        shell: bash
        run: |
          set -euo pipefail
          ./Godot_v4.7.1-stable_linux.x86_64 \
            --headless \
            --path . \
            --export-pack "Windows Demo" \
            builds/windows/windows-runtime-json-proof.pck
          test -s builds/windows/windows-runtime-json-proof.pck
          ./Godot_v4.7.1-stable_linux.x86_64 \
            --headless \
            --main-pack builds/windows/windows-runtime-json-proof.pck \
            --script res://tools/validation/verify_exported_runtime_json.gd \
            2>&1 | tee builds/windows/windows-runtime-json-proof.log
          grep -F 'RUNTIME_JSON_PACK_PROOF: PASS' builds/windows/windows-runtime-json-proof.log

      - name: Prove Android preset runtime JSON payload
        shell: bash
        run: |
          set -euo pipefail
          ./Godot_v4.7.1-stable_linux.x86_64 \
            --headless \
            --path . \
            --export-pack "Android Validation" \
            builds/windows/android-validation-runtime-json-proof.pck
          test -s builds/windows/android-validation-runtime-json-proof.pck
          ./Godot_v4.7.1-stable_linux.x86_64 \
            --headless \
            --main-pack builds/windows/android-validation-runtime-json-proof.pck \
            --script res://tools/validation/verify_exported_runtime_json.gd \
            2>&1 | tee builds/windows/android-validation-runtime-json-proof.log
          grep -F 'RUNTIME_JSON_PACK_PROOF: PASS' builds/windows/android-validation-runtime-json-proof.log

      - name: Verify and hash artifact
        run: |
          test -s builds/windows/SwitchyExpressVerticalSlice.exe
          test -s builds/windows/SwitchyExpressVerticalSlice.pck
          test -s builds/windows/windows-runtime-json-proof.pck
          test -s builds/windows/windows-runtime-json-proof.log
          test -s builds/windows/android-validation-runtime-json-proof.pck
          test -s builds/windows/android-validation-runtime-json-proof.log
          sha256sum \
            builds/windows/SwitchyExpressVerticalSlice.exe \
            builds/windows/SwitchyExpressVerticalSlice.pck \
            builds/windows/windows-runtime-json-proof.pck \
            builds/windows/android-validation-runtime-json-proof.pck \
            > builds/windows/SHA256SUMS.txt
          cat builds/windows/SHA256SUMS.txt

      - name: Upload Windows demo artifact
        uses: actions/upload-artifact@v4
        with:
          name: switchy-express-windows-demo-${{ github.sha }}
          path: |
            builds/windows/SwitchyExpressVerticalSlice.exe
            builds/windows/SwitchyExpressVerticalSlice.pck
            builds/windows/windows-runtime-json-proof.pck
            builds/windows/windows-runtime-json-proof.log
            builds/windows/android-validation-runtime-json-proof.pck
            builds/windows/android-validation-runtime-json-proof.log
            builds/windows/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
