name: Validate Base v9.4.3 First Prompt Adapter
on:
  pull_request:
    paths: ["skills/PROJECT_BASE_ADAPTER.json","tests/test_base_v943_first_prompt_adoption.py",".github/workflows/validate-base-v943-first-prompt-adapter.yml"]
permissions: {contents: read}
jobs:
  adapter-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: "3.12"}
      - run: python tests/test_base_v943_first_prompt_adoption.py
