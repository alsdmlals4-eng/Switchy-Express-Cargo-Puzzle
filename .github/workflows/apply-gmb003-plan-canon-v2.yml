name: Apply GMB-003 Planning Canon v2

on:
  push:
    branches:
      - agent/gmb-003-route-end-switch-direction-plan
    paths:
      - .github/workflows/apply-gmb003-plan-canon-v2.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: agent/gmb-003-route-end-switch-direction-plan
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Execute corrected fail-closed transform
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          source_path = Path('.github/workflows/apply-gmb003-plan-canon.yml')
          source = source_path.read_text(encoding='utf-8')
          start_marker = "          python - <<'PY'\n"
          end_marker = "\n          PY\n"
          start = source.index(start_marker) + len(start_marker)
          end = source.index(end_marker, start)
          body = textwrap.dedent(source[start:end])

          old_start = '''replace_once(
              decisions,
              """사용자가 확인한 범위:'''
          old_end = '''replace_once(
              decisions,
              """PC: main Fetch/Pull'''
          block_start = body.index(old_start)
          block_end = body.index(old_end, block_start)
          corrected = '''replace_once(
              decisions,
              """## Open Gates

          - PC local one-sided station and mid-run exit retest: `RETEST_REQUIRED`
          - Title exit visibility: `PASS · USER LOCAL`
          - Windows artifact runtime·visual·audio·physical input smoke: `NOT_RUN`
          - Android landscape device smoke: `NOT_RUN`
          - five-person comprehension: `NOT_RUN`
          - production cutover: `BLOCKED`
          """,
              """## Open Gates

          - Red one-sided station runtime: `PASS · USER LOCAL · EV-USER-028`
          - Blue one-sided station runtime: `FAIL · USER LOCAL · EV-USER-028 · ROOT_CAUSE_UNVERIFIED`
          - SUCCESS result visibility: `PASS · USER LOCAL · EV-USER-029`
          - Route-end game over: `APPROVED · IMPLEMENTATION_PENDING`
          - Switch three-direction arrows and U-turn: `APPROVED · IMPLEMENTATION_PENDING`
          - PC local route and mid-run retest: `RETEST_REQUIRED`
          - Windows artifact runtime·visual·audio·physical input smoke: `NOT_RUN`
          - Android landscape device smoke: `NOT_RUN`
          - five-person comprehension: `NOT_RUN`
          - production cutover: `BLOCKED`
          """,
          )
          '''
          body = body[:block_start] + corrected + body[block_end:]
          exec(compile(body, '<gmb003-canon-transform>', 'exec'))
          PY
          rm .github/workflows/apply-gmb003-plan-canon.yml
          rm .github/workflows/apply-gmb003-plan-canon-v2.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "docs: sync GMB-003 planning canon"
          git push origin HEAD:agent/gmb-003-route-end-switch-direction-plan
