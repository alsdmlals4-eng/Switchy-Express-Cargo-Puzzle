name: Godot Tests

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  headless-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download Godot 4.7.1
        run: |
          curl --fail --location --retry 3 \
            --output godot.zip \
            https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q godot.zip
          chmod +x Godot_v4.7.1-stable_linux.x86_64
          ./Godot_v4.7.1-stable_linux.x86_64 --version

      - name: Run headless tests
        shell: bash
        run: |
          set +e
          output=$(timeout 30s ./Godot_v4.7.1-stable_linux.x86_64 \
            --headless \
            --path . \
            --script res://tests/run_tests.gd 2>&1)
          status=$?
          set -e

          printf '%s\n' "$output"

          if printf '%s\n' "$output" | grep -E 'SCRIPT ERROR:|(^|[[:space:]])ERROR:'; then
            echo 'Godot emitted a runtime or script error.' >&2
            exit 1
          fi

          exit "$status"

      - name: Run Switchy real-project live-editor Pilot
        run: |
          mkdir -p artifacts/godot-live-editor-ci
          python tools/run_switchy_godot_live_editor_pilot.py \
            --godot ./Godot_v4.7.1-stable_linux.x86_64 \
            --report artifacts/godot-live-editor-ci/switchy-pilot-report.json

      - name: Upload Switchy live-editor Pilot report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: switchy-godot-live-editor-pilot-report
          path: artifacts/godot-live-editor-ci/switchy-pilot-report.json
          if-no-files-found: error
