name: Post-SX-DEC-060 Candidate PowerShell Contract

on:
  pull_request:
    branches: [main]
    paths:
      - RUN_SX59_POC_SELF_RUN.ps1
      - RUN_SX60_POC_SELF_RUN.ps1
      - evidence/acceptance/current_poc_candidate.json
      - evidence/acceptance/post_sx_dec_060_candidate.json
      - evidence/acceptance/sx59_poc_accept_*_artifact.json
      - evidence/acceptance/sx60_poc_accept_*_artifact.json
      - 기획서/50_제작_검증/SX_DEC_059_POC_DEVELOPER_SELF_RUN_RECORD_*.md
      - 기획서/50_제작_검증/SX_DEC_060_POC_ACCEPTANCE_CANDIDATE_*.md
      - 기획서/50_제작_검증/SX_DEC_060_POC_DEVELOPER_SELF_RUN_RECORD_*.md
      - tests/python/test_candidate_002_powershell_self_run.py
      - tests/python/test_current_poc_candidate_pointer.py
      - tests/python/test_sx_dec_060_candidate_mint.py
      - tests/python/test_sx_dec_060_candidate_002_evidence.py
      - .github/workflows/candidate-self-run-powershell.yml
  push:
    branches: [main]
    paths:
      - RUN_SX59_POC_SELF_RUN.ps1
      - RUN_SX60_POC_SELF_RUN.ps1
      - evidence/acceptance/current_poc_candidate.json
      - evidence/acceptance/post_sx_dec_060_candidate.json
      - evidence/acceptance/sx59_poc_accept_*_artifact.json
      - evidence/acceptance/sx60_poc_accept_*_artifact.json
      - 기획서/50_제작_검증/SX_DEC_059_POC_DEVELOPER_SELF_RUN_RECORD_*.md
      - 기획서/50_제작_검증/SX_DEC_060_POC_ACCEPTANCE_CANDIDATE_*.md
      - 기획서/50_제작_검증/SX_DEC_060_POC_DEVELOPER_SELF_RUN_RECORD_*.md
      - tests/python/test_candidate_002_powershell_self_run.py
      - tests/python/test_current_poc_candidate_pointer.py
      - tests/python/test_sx_dec_060_candidate_mint.py
      - tests/python/test_sx_dec_060_candidate_002_evidence.py
      - .github/workflows/candidate-self-run-powershell.yml

permissions:
  contents: read
  actions: read

jobs:
  validate-powershell:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Parse historical and post-060 PowerShell launchers
        shell: powershell
        run: |
          foreach ($scriptName in @('RUN_SX59_POC_SELF_RUN.ps1', 'RUN_SX60_POC_SELF_RUN.ps1')) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Join-Path $PWD $scriptName),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | Format-List | Out-String | Write-Error
              exit 1
            }
          }
          Write-Host 'POWERSHELL_51_PARSE: PASS'

      - name: Verify post-060 explicit candidate contract
        shell: powershell
        run: |
          .\RUN_SX60_POC_SELF_RUN.ps1 -ContractCheck -NoLaunch -NoOpenRecord

      - name: Run historical evidence-only contract check
        shell: powershell
        run: |
          .\RUN_SX59_POC_SELF_RUN.ps1 -HistoricalEvidenceOnly -ContractCheck -NoLaunch -NoOpenRecord

      - name: Verify historical pre-SX-DEC-060 Candidate 003 exact bytes
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          .\RUN_SX59_POC_SELF_RUN.ps1 `
            -HistoricalEvidenceOnly `
            -NoLaunch `
            -NoOpenRecord `
            -WorkDir (Join-Path $env:RUNNER_TEMP 'switchy-historical-candidate-003')

      - name: Verify post-060 candidate package without launch
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          .\RUN_SX60_POC_SELF_RUN.ps1 `
            -NoLaunch `
            -NoOpenRecord `
            -WorkDir (Join-Path $env:RUNNER_TEMP 'switchy-post-060-candidate-002')
