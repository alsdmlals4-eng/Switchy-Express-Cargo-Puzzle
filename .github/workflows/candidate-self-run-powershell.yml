name: Post-SX-DEC-060 Candidate PowerShell Contract

on:
  pull_request:
    branches: [main]
    paths:
      - RUN_SX59_POC_SELF_RUN.ps1
      - RUN_SX60_POC_SELF_RUN.ps1
      - evidence/acceptance/current_poc_candidate.json
      - evidence/acceptance/post_sx_dec_060_candidate.json
      - evidence/acceptance/sx59_poc_accept_*_artifact.json
      - 기획서/50_제작_검증/SX_DEC_059_POC_DEVELOPER_SELF_RUN_RECORD_*.md
      - tests/python/test_candidate_002_powershell_self_run.py
      - tests/python/test_current_poc_candidate_pointer.py
      - .github/workflows/candidate-self-run-powershell.yml
  push:
    branches: [main]
    paths:
      - RUN_SX59_POC_SELF_RUN.ps1
      - RUN_SX60_POC_SELF_RUN.ps1
      - evidence/acceptance/current_poc_candidate.json
      - evidence/acceptance/post_sx_dec_060_candidate.json
      - evidence/acceptance/sx59_poc_accept_*_artifact.json
      - 기획서/50_제작_검증/SX_DEC_059_POC_DEVELOPER_SELF_RUN_RECORD_*.md
      - tests/python/test_candidate_002_powershell_self_run.py
      - tests/python/test_current_poc_candidate_pointer.py
      - .github/workflows/candidate-self-run-powershell.yml

permissions:
  contents: read

jobs:
  validate-powershell:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: Parse historical and post-060 PowerShell launchers
        shell: powershell
        run: |
          foreach ($scriptName in @('RUN_SX59_POC_SELF_RUN.ps1', 'RUN_SX60_POC_SELF_RUN.ps1')) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Join-Path $PWD $scriptName),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | Format-List | Out-String | Write-Error
              exit 1
            }
          }
          Write-Host 'POWERSHELL_51_PARSE: PASS'

      - name: Run post-060 fail-closed contract check
        shell: powershell
        run: |
          .\RUN_SX60_POC_SELF_RUN.ps1 -ContractCheck -NoLaunch -NoOpenRecord

      - name: Run historical evidence-only contract check
        shell: powershell
        run: |
          .\RUN_SX59_POC_SELF_RUN.ps1 -HistoricalEvidenceOnly -ContractCheck -NoLaunch -NoOpenRecord

      - name: Prove no post-060 candidate is launched before one exists
        shell: powershell
        run: |
          try {
            .\RUN_SX60_POC_SELF_RUN.ps1 -NoLaunch -NoOpenRecord
            throw 'Expected post-060 candidate launcher to fail closed.'
          } catch {
            if ($_.Exception.Message -notlike '*POST_SX_DEC_060_CANDIDATE_NOT_CREATED*') {
              throw
            }
          }
          Write-Host 'POST_SX_DEC_060_CANDIDATE_NOT_CREATED: PASS'
