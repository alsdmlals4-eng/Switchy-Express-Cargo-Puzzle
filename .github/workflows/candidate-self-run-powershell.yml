name: Candidate Self-Run PowerShell Contract

on:
  pull_request:
    branches: [main]
    paths:
      - RUN_SX59_POC_SELF_RUN.ps1
      - evidence/acceptance/current_poc_candidate.json
      - evidence/acceptance/sx59_poc_accept_*_artifact.json
      - 기획서/50_제작_검증/SX_DEC_059_POC_DEVELOPER_SELF_RUN_RECORD_*.md
      - tests/python/test_candidate_002_powershell_self_run.py
      - tests/python/test_current_poc_candidate_pointer.py
      - .github/workflows/candidate-self-run-powershell.yml
  push:
    branches: [main]
    paths:
      - RUN_SX59_POC_SELF_RUN.ps1
      - evidence/acceptance/current_poc_candidate.json
      - evidence/acceptance/sx59_poc_accept_*_artifact.json
      - 기획서/50_제작_검증/SX_DEC_059_POC_DEVELOPER_SELF_RUN_RECORD_*.md
      - tests/python/test_candidate_002_powershell_self_run.py
      - tests/python/test_current_poc_candidate_pointer.py
      - .github/workflows/candidate-self-run-powershell.yml

permissions:
  contents: read
  actions: read

jobs:
  validate-powershell:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: Parse PowerShell launcher
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD 'RUN_SX59_POC_SELF_RUN.ps1'),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | Format-List | Out-String | Write-Error
            exit 1
          }
          Write-Host 'POWERSHELL_51_PARSE: PASS'

      - name: Run evidence-only contract check
        shell: powershell
        run: |
          .\RUN_SX59_POC_SELF_RUN.ps1 -ContractCheck -NoLaunch -NoOpenRecord

      - name: Prove current candidate download and package verification on Windows
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          .\RUN_SX59_POC_SELF_RUN.ps1 `
            -NoLaunch `
            -NoOpenRecord `
            -WorkDir (Join-Path $env:RUNNER_TEMP 'switchy-current-poc-candidate')
