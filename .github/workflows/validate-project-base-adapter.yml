name: Validate Project Base Adapter

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
    branches: [main]
    paths:
      - .agents/skills/switchy-express-cargo-puzzle-workflow-router/**
      - skills/PROJECT_BASE_ADAPTER.json
      - skills/PROJECT_SKILL_SNAPSHOT.json
      - skills/SKILL_REGISTRY.json
      - docs/PROJECT_OPERATING_DASHBOARD.html
      - docs/PROJECT_OPERATING_HEALTH.json
      - docs/operations/PROJECT_PROTECTED_CHANGE_APPROVAL.json
      - docs/operations/SWITCHY_ADAPTER_MIGRATION_STATE_*.json
      - docs/operations/SWITCHY_SHEET_AUTHORITY_EVIDENCE_*.json
      - tests/python/test_project_base_adapter_thin_migration.py
      - tests/test_base_shared_external_ai_adapter.py
      - tests/test_base_v942_planning_first_adoption.py
      - tests/test_base_v943_first_prompt_adoption.py
      - tests/test_base_v94_ai_operations_adoption.py
      - tests/python/test_v48_current_authority_migration.py
      - tests/test_post_merge_canon_freshness.py
      - tests/python/test_v48_protected_canon_freshness.py
      - .github/workflows/validate-project-base-adapter.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out project
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Check out current Base validator snapshot
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: alsdmlals4-eng/Base
          ref: 2828a74f60c1ed09546171040f4178c8848ea686
          path: .base-contract
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python -m pip install -r .base-contract/.github/validation-requirements.txt
      - name: Select the trusted protected baseline
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          ADAPTER_PATH="skills/PROJECT_BASE_ADAPTER.json"
          ADAPTER_CHANGES="$(git diff --name-only "$PR_BASE_SHA"...HEAD -- "$ADAPTER_PATH")"
          if printf '%s\n' "$ADAPTER_CHANGES" | grep -Fxq "$ADAPTER_PATH"; then
            PROTECTED_BASE_SHA="$PR_BASE_SHA"
          else
            PROTECTED_BASE_SHA="$(
              git show "$PR_BASE_SHA:$ADAPTER_PATH" |
                python -c 'import json, sys; payload = json.load(sys.stdin); print(payload["protected_baseline"]["commit"])'
            )"
          fi
          python -c 'import re, sys; value = sys.argv[1]; raise SystemExit(0 if re.fullmatch(r"[0-9a-f]{40}", value) else 1)' "$PROTECTED_BASE_SHA"
          git cat-file -e "$PROTECTED_BASE_SHA^{commit}"
          git merge-base --is-ancestor "$PROTECTED_BASE_SHA" "$PR_BASE_SHA"
          printf 'PROTECTED_BASE_SHA=%s\n' "$PROTECTED_BASE_SHA" >> "$GITHUB_ENV"
      - name: Validate adapter and exact protected change approval
        env:
          EXTERNAL_APPROVAL: ${{ contains(github.event.pull_request.labels.*.name, 'approved-protected-change') }}
        run: |
          set -euo pipefail
          APPROVAL_PATH="docs/operations/PROJECT_PROTECTED_CHANGE_APPROVAL.json"
          APPROVAL_ARGS=()
          if [ -f "$APPROVAL_PATH" ]; then
            APPROVAL_ARGS=(--approval "$APPROVAL_PATH")
          fi
          python .base-contract/tools/check_approved_project_operating_contract.py \
            --project-root . \
            --base-repository .base-contract \
            --protected-base "$PROTECTED_BASE_SHA" \
            --external-approval "$EXTERNAL_APPROVAL" \
            "${APPROVAL_ARGS[@]}" \
            --check
