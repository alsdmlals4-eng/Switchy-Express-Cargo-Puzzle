name: Validate Project Base Adapter

on:
  pull_request:
    branches: [main]
    paths:
      - .agents/skills/switchy-express-cargo-puzzle-workflow-router/**
      - skills/PROJECT_BASE_ADAPTER.json
      - skills/PROJECT_SKILL_SNAPSHOT.json
      - skills/SKILL_REGISTRY.json
      - docs/PROJECT_OPERATING_DASHBOARD.html
      - docs/PROJECT_OPERATING_HEALTH.json
      - docs/operations/SWITCHY_ADAPTER_MIGRATION_STATE_*.json
      - docs/operations/SWITCHY_SHEET_AUTHORITY_EVIDENCE_*.json
      - tests/python/test_project_base_adapter_thin_migration.py
      - tests/test_base_shared_external_ai_adapter.py
      - tests/test_base_v942_planning_first_adoption.py
      - tests/test_base_v943_first_prompt_adoption.py
      - tests/test_base_v94_ai_operations_adoption.py

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out project
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Check out trusted Base validator
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: alsdmlals4-eng/Base
          ref: bfdc9e44d4a6920dc085eaa3f9d19d31b1acd2a1
          path: .base-contract
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python -m pip install -r .base-contract/.github/validation-requirements.txt
      - name: Validate adapter against exact PR base
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set +e
          output=$(python .base-contract/tools/check_project_operating_contract.py \
            --project-root . \
            --base-repository .base-contract \
            --protected-base "$PR_BASE_SHA" \
            --check 2>&1)
          status=$?
          printf '%s\n' "$output"
          if [ "$status" -ne 0 ]; then
            while IFS= read -r line; do
              escaped=${line//'%'/'%25'}
              escaped=${escaped//$'\r'/'%0D'}
              escaped=${escaped//$'\n'/'%0A'}
              printf '::error file=skills/PROJECT_BASE_ADAPTER.json::%s\n' "$escaped"
            done <<< "$output"
          fi
          exit "$status"
