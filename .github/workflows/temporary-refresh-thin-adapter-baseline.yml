name: Refresh strict adapter to latest exact baseline

on:
  push:
    branches:
      - agent/rebuild-thin-base-adapter
    paths:
      - .github/workflows/temporary-refresh-thin-adapter-baseline.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out project history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Check out trusted Base contract
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: alsdmlals4-eng/Base
          ref: bfdc9e44d4a6920dc085eaa3f9d19d31b1acd2a1
          path: .base-contract
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python -m pip install -r .base-contract/.github/validation-requirements.txt
      - name: Refresh authority and evidence
        env:
          PROJECT_BASE_SHA: 8c6dd60c634019e64178e72aa4959a2a970708e1
        run: python tools/temporary_refresh_thin_adapter_baseline.py
      - name: Regenerate and validate
        env:
          PROJECT_BASE_SHA: 8c6dd60c634019e64178e72aa4959a2a970708e1
        run: |
          python .base-contract/tools/build_project_operating_artifacts.py --project-root . --base-repository .base-contract --protected-base "$PROJECT_BASE_SHA" --write
          python .base-contract/tools/check_project_operating_contract.py --project-root . --base-repository .base-contract --protected-base "$PROJECT_BASE_SHA" --check
          python tests/python/test_project_base_adapter_thin_migration.py -v
      - name: Commit refreshed authority artifacts only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add skills/PROJECT_BASE_ADAPTER.json docs/PROJECT_OPERATING_HEALTH.json docs/operations/SWITCHY_ADAPTER_MIGRATION_STATE_2026-08-06.json docs/operations/SWITCHY_SHEET_AUTHORITY_EVIDENCE_2026-08-06.json skills/PROJECT_SKILL_SNAPSHOT.json docs/PROJECT_OPERATING_DASHBOARD.html .agents/skills/switchy-express-cargo-puzzle-workflow-router/SKILL.md
          git diff --cached --check
          git commit -m "fix: refresh strict adapter to exact latest main"
          git push origin HEAD:agent/rebuild-thin-base-adapter
