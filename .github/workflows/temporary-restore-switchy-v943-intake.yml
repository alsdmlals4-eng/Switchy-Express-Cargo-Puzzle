name: Temporary Restore Switchy v9.4.3 Intake Contracts

on:
  pull_request:
    paths:
      - "tools/restore_switchy_v943_intake_contracts.py"
      - ".github/workflows/temporary-restore-switchy-v943-intake.yml"

permissions:
  contents: write

jobs:
  restore:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/restore_switchy_v943_intake_contracts.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add skills/PROJECT_BASE_ADAPTER.json
          git rm tools/restore_switchy_v943_intake_contracts.py .github/workflows/temporary-restore-switchy-v943-intake.yml
          git commit -m "fix: preserve planning-first with v9.4.3 first-prompt"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
