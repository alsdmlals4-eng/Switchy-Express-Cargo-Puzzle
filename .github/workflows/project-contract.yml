name: Project Contract

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate project operating contract
        run: python tools/validate_project_contract.py
      - name: Validate Hera repo adoption recovery
        run: python tests/python/test_hera_repo_adoption_reconciliation.py -v
      - name: Validate local tooling and asset-vault reconciliation
        run: python tests/python/test_local_tooling_reconciliation.py -v
      - name: Reject local-only vault tracking expansion
        run: python tools/validate_local_tooling_reconciliation.py
      - name: Validate final E+D product asset promotion
        run: python tests/python/test_final_ed_product_asset_promotion.py -v
      - name: Validate Base v9.4 AI operations adoption
        run: python -m unittest tests.test_base_v94_ai_operations_adoption -v
      - name: Validate Base adapter workflow scope
        run: python tests/python/test_project_base_adapter_workflow_scope.py -v
      - name: Validate Android smoke canonical freshness
        run: python tests/python/test_android_smoke_canonical_freshness_contract.py -v
      - name: Validate post-merge canonical freshness
        run: python tests/test_post_merge_canon_freshness.py -v
      - name: Validate SX-DEC-059 implementation canonical freshness
        run: python tests/python/test_sx_dec_059_implementation_canonical_freshness.py -v
      - name: Validate v4.8 current authority migration
        run: python tests/python/test_v48_current_authority_migration.py -v
      - name: Validate v4.8 protected canon freshness
        run: python tests/python/test_v48_protected_canon_freshness.py -v
      - name: Validate playable POC post-merge canon
        run: python tests/python/test_playable_poc_postmerge_canon.py -v
      - name: Validate current acceptance artifact evidence contract
        run: python tests/python/test_acceptance_artifact_evidence_contract.py -v
      - name: Validate Godot PCK integrity verifier
        run: python tests/python/test_godot_pck_integrity_tool.py -v
      - name: Validate Switchy Editor Pilot plugin contract
        run: python tests/python/test_switchy_godot_live_editor_pilot_plugin_contract.py -v
      - name: Validate Switchy Pilot runner contract
        run: python tests/python/test_switchy_godot_live_editor_pilot_runner_contract.py -v
      - name: Validate Switchy Pilot Runtime error classification
        run: python tests/python/test_switchy_godot_live_editor_pilot_runner_errors.py -v
      - name: Validate Switchy Pilot unconfigured Runtime path
        run: python tests/python/test_switchy_godot_live_editor_pilot_runtime.py -v
      - name: Validate Switchy Godot live-editor Pilot contract
        run: python tests/python/test_switchy_godot_live_editor_pilot_contract.py -v
      - name: Check whitespace and patch integrity
        run: git diff --check
      - name: Parse project JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for path in Path('.').rglob('*.json'):
              if '.git' not in path.parts:
                  json.loads(path.read_text(encoding='utf-8'))
          print('JSON parse: PASS')
          PY
      - name: Reject stale bracketed planning paths
        run: |
          python - <<'PY'
          from pathlib import Path
          stale_token = chr(91) + '기획서' + chr(93)
          stale = []
          for path in Path('.').rglob('*'):
              if not path.is_file() or '.git' in path.parts:
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              if stale_token in text:
                  stale.append(str(path))
          if stale:
              raise SystemExit(f'stale bracketed planning references: {stale}')
          print('canonical planning paths: PASS')
          PY